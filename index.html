function home(){const s=state();return `<section class="hero"><div><div class="eyebrow">EHEDG DOC. 58 / HỌC ĐỂ ÁP DỤNG</div><h1>Rủi ro vệ sinh.<br>Chặn từ<br>bản vẽ.</h1><p>Nhận diện chất nhiễm và đường nhiễm. Cân tác động và khả năng xảy ra. Chọn biện pháp giảm rủi ro đáng tin cậy nhất cho nhà xưởng và thiết bị thực phẩm.</p><div class="row"><button class="primary" data-start>▶ ${db.active&&s.seen.length?'Tiếp tục trình chiếu':'Bắt đầu tự trình chiếu'}</button><button class="ghost" data-manual>Tự xem thủ công</button><button class="ghost" data-go="resources">Tài liệu & phạm vi</button></div><p class="small" style="margin-top:14px">Tự đọc tiếng Việt · 1,2× mặc định · tự chuyển màn hình<br>Cần Internet. Lời thuyết minh được gửi tới Google Translate TTS.</p><div class="stats"><div><b>08</b><span>Bài học ngắn</span></div><div><b>32</b><span>Màn hình nội dung</span></div><div><b>16</b><span>Câu đánh giá</span></div></div></div><div class="hero-diagram">${heroSVG()}</div></section><div class="section-head"><div><div class="eyebrow" style="margin-bottom:9px">LỘ TRÌNH CỦA BẠN</div><h2>Từ nhận diện đến báo cáo</h2><p>${C.audience} · Dự kiến ${C.duration}</p></div><span class="pill">${s.completed.length}/8 hoàn thành</span></div><div class="modules">${C.modules.map(m=>`<button class="module-card" data-m="${m.id}" data-slide="${moduleSlides(m.id)[0].id}"><span class="badge">${s.completed.includes(m.id)?'✓':String(m.id).padStart(2,'0')}</span><div><h3>${esc(m.title)}</h3><p>${esc(m.description)}</p><div class="meta"><span>${m.duration} · 4 màn hình</span><span>${s.completed.includes(m.id)?'Đã hoàn thành':moduleSlides(m.id).some(x=>s.seen.includes(x.id))?'Đang học':'Bắt đầu →'}</span></div></div></button>`).join('')}</div><div class="notice"><b>Cách hoàn thành:</b> xem đủ 4 màn hình mỗi bài và trả lời đúng 2 câu luyện tập. Sau 8 bài, làm bài đánh giá 16 câu; cần ít nhất ${needed()}/16 câu đúng (ngưỡng ${C.passPercent}%).</div><section class="author"><span class="avatar" aria-hidden="true">ĐB</span><div><small>Biên soạn & thiết kế khóa học</small><b>Đặng Thanh Bình</b><a href="mailto:dangthanhbinh53@gmail.com">dangthanhbinh53@gmail.com</a><p>© 2026 Đặng Thanh Bình. Bản quyền thuộc về tác giả đối với phần biên soạn tiếng Việt, ví dụ minh họa, thiết kế và phần mềm khóa học. Nội dung gốc EHEDG Doc. 58 © EHEDG.</p></div></section><p class="small">Nội dung diễn giải từ bản tháng 5/2024 do người dùng cung cấp. Không phải bản dịch chính thức, chương trình chứng nhận EHEDG hoặc đặc tả thiết kế cho một nhà máy cụ thể.</p>`}

function slideView(id){const s=C.slides.find(x=>x.id===id);if(!s)return home();const m=C.modules[s.module-1],siblings=moduleSlides(s.module),idx=siblings.findIndex(x=>x.id===id);return `<div class="row between no-print" style="margin-bottom:18px"><span class="pill">Bài ${s.module} / 8 · ${esc(m.title)}</span><button data-present>${document.body.classList.contains('present')?'Thoát trình chiếu':'⛶ Trình chiếu'}</button></div><article class="lesson"><header class="lesson-head" data-n="${String(id).padStart(2,'0')}"><div class="eyebrow">${String(id).padStart(2,'0')} / ${C.slides.length} &nbsp; · &nbsp; ${idx+1} / 4 TRONG BÀI</div><h2>${esc(s.title)}</h2><p class="lead">${esc(s.lead)}</p></header><div class="grid">${s.cards.map((c,i)=>`<section class="card"><span class="index">0${i+1}</span><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></section>`).join('')}</div>${s.example?`<aside class="example"><small>Ví dụ <i>· nguồn ghi ở đầu câu</i></small>${esc(s.example)}</aside>`:''}${visual(s.visual)}<div class="takeaway"><small>ĐIỀU CẦN NHỚ</small>${esc(s.takeaway)}</div>${source(s)}${mode==='trainer'?`<aside class="trainer-note"><small>GỢI Ý CHO GIẢNG VIÊN · Không ghi nhận tiến độ ở chế độ này</small>${esc(s.trainer)}<p style="margin:10px 0 0"><b>Mục tiêu bài:</b> ${esc(m.objective)}</p></aside>`:''}<details><summary>Lời thuyết minh & bản đọc</summary><p>${esc(s.narration)}</p></details><footer class="lesson-nav"><button data-slide="${id-1}" ${id===1?'disabled':''}>← Trước</button><div class="dots" aria-label="Các màn hình trong bài">${siblings.map(x=>`<button class="${x.id===id?'active':state().seen.includes(x.id)?'seen':''}" data-slide="${x.id}" aria-label="Màn hình ${x.id}: ${esc(x.title)}" title="${esc(x.title)}"></button>`).join('')}</div><small>${mode==='learner'?'Đã ghi nhận xem màn hình':'Chế độ giảng viên'}</small>${idx===3?`<button class="primary" data-practice="${s.module}">Luyện tập bài ${s.module} →</button>`:`<button class="primary" data-slide="${id+1}">Tiếp theo →</button>`}</footer></article>${audioBar()}`}
function audioBar(){return `<div class="audio no-print"><div class="tts-track"><i id="tts-progress"></i></div><button data-tts-prev aria-label="Màn hình trước" ${route.id===1?'disabled':''}>←</button><button data-pause class="primary">${speech.active?(speech.paused?'▶ Tiếp tục':'Ⅱ Tạm dừng'):'▶ Phát'}</button><button data-tts-next aria-label="Màn hình tiếp" ${route.id===C.slides.length?'disabled':''}>→</button><button data-speak>Đọc lại</button><button data-stop>Dừng</button><button data-mute aria-pressed="${speech.muted}">${speech.muted?'Bật tiếng':'Tắt tiếng'}</button><label>Tốc độ <select id="rate">${[0.9,1,1.2,1.4].map(r=>`<option value="${r}" ${speech.rate===r?'selected':''}>${String(r).replace('.',',')}×</option>`).join('')}</select></label><label><input id="auto-read" type="checkbox" ${speech.auto?'checked':''}>Tự chuyển</label><label><input id="pause-practice" type="checkbox" ${speech.stopAtPractice?'checked':''}>Dừng ở luyện tập</label><span id="audio-status" class="audio-status" role="status">${esc(speech.message)}</span><small class="tts-disclosure">Google Translate TTS · Cần Internet. Lời thuyết minh được gửi tới Google; không gửi thông tin học viên.</small></div>`}
const principleInfo=[['Vật liệu','Tương thích vật liệu: trơ với sản phẩm, chất tẩy rửa và khử trùng; chống ăn mòn, không độc, không gây mùi vị lạ, không xốp, bền cơ học. Tính cả keo, chất trám, chất bôi trơn, vật liệu cách nhiệt (§4.1, tr. 11).'],['Tách biệt','Khả năng tách biệt: quản lý mối nguy và các tác nhân mang chúng — người, vật liệu, tiện ích — bằng rào chắn vật lý, khoảng cách, bố trí, phân vùng vệ sinh hoặc trình tự; cách nhiệt để tránh ngưng tụ (§4.1, tr. 12).'],['Làm sạch','Khả năng làm sạch: làm sạch hiệu quả trong thời gian và công sức hợp lý. Bề mặt hoàn thiện phù hợp, mối nối và mối hàn vệ sinh, góc bo tròn, sàn dốc về cống, nóc tủ dốc (§4.1, tr. 12).'],['Thoát','Khả năng thoát: không tích tụ và thoát hết chất lỏng, sản phẩm, bụi. Tránh đầu cụt, hốc, góc nhọn, khe nứt, mối ghép chồng, gờ, tiếp xúc kim loại với kim loại, ren hở (§4.1, tr. 12).'],['Tiếp cận','Khả năng tiếp cận: mọi khu vực tiếp cận được để vệ sinh, khử trùng, kiểm tra và bảo trì. Bề mặt tiếp cận được tại chỗ, hoặc thiết bị dễ tháo rời (§4.1, tr. 12).']];
const MATRICES=[{name:'Ví dụ 5.3.2.1 · khả năng cao thì ít nhất là trung bình',g:[['M','H','H'],['L','M','H'],['L','M','M']]},{name:'Ví dụ 5.3.2.2 · tác động thấp thì rủi ro thấp',g:[['L','M','H'],['L','M','H'],['L','L','M']]}],LEVEL={L:['Thấp','#1c8a3a'],M:['Trung bình','#c47a00'],H:['Cao','#d42f4b']},LIKE=['Cao','Trung bình','Thấp'],IMPACT=['Thấp','Trung bình','Cao'];

function matrixTable(){const g=MATRICES[matrixSel.v].g,r=LEVEL[g[matrixSel.l][matrixSel.i]];return `<table class="mx"><thead><tr><th></th>${IMPACT.map(x=>`<th>Tác động ${x.toLowerCase()}</th>`).join('')}</tr></thead><tbody>${g.map((row,a)=>`<tr><th>Khả năng ${LIKE[a].toLowerCase()}</th>${row.map((c,b)=>`<td class="${a===matrixSel.l&&b===matrixSel.i?'sel':''}" style="background:${LEVEL[c][1]}">${LEVEL[c][0]}</td>`).join('')}</tr>`).join('')}</tbody></table><p>Kết quả trên ma trận này: <b style="color:${r[1]}">rủi ro ${r[0].toLowerCase()}</b>.<br><small>Hai ma trận đều là ví dụ trong tài liệu. Đội HDRM tự chọn và giải trình ma trận của mình.</small></p>`}

function visual(kind){if(!kind||kind==='hero')return '';let b='';
const flow=(nodes)=>`<div class="flow">${nodes.map((x,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node">${x[0]}<small>${x[1]}</small></div>`).join('')}</div>`;
if(kind==='model')b=flow([['1 · Phạm vi','Bối cảnh · tiêu chí'],['2 · Nhận diện','Chất nhiễm + cơ chế'],['3 · Phân tích','Tác động × khả năng'],['4 · Giảm rủi ro','Theo thứ bậc biện pháp'],['5 · Kiểm chứng','Giám sát · báo cáo']])+`<p class="small" style="margin:12px 0 0">↺ Chưa đạt mức mong muốn thì quay lại các bước trước. Sơ đồ biên soạn từ §5.1 và Hình 2.</p>`;
if(kind==='principles')b=`<div class="eyebrow">NĂM NGUYÊN TẮC · CHỌN TỪNG MỤC</div><p class="small">Ba mục tiêu được hiện thực hóa bằng năm nguyên tắc thiết kế vệ sinh.</p><div class="ahu">${principleInfo.map((x,i)=>`<button data-ahu="${i}" class="${i===0?'active':''}">${icon(i)}${x[0]}</button>`).join('')}</div><div class="explanation" id="ahu-info" role="status">${principleInfo[0][1]}</div>`;
if(kind==='chain')b=flow([['Thu hoạch','Dễ vệ sinh, ít bám đất'],['Phân loại','Cơ bản; không thủy tinh, tách chất bôi trơn'],['Thái lát','Không đọng; vật liệu cấp thực phẩm'],['Chiên','Tiếp cận để vệ sinh; chịu nhiệt, hóa chất'],['Tẩm & đóng gói','Ăn liền: không nơi ẩn náu vi khuẩn'],['Trưng bày','Ít yêu cầu: bao bì đã bảo vệ']])+`<p class="small" style="margin:12px 0 0">Ví dụ chuỗi khoai tây lát chiên ở §4.4.1. Mức thiết kế vệ sinh của cơ sở phải do đánh giá rủi ro riêng xác định.</p>`;
if(kind==='lifecycle')b=flow([['Chế tạo','Tại nhà cung cấp'],['Vận chuyển','Tới nhà máy'],['Lắp đặt','Lắp ráp & lắp đặt'],['Khởi động','Chạy thử · thẩm định'],['Vận hành','Chế biến · vệ sinh · bảo trì · thay đổi'],['Kết thúc','Ngừng dùng · thải bỏ']])+`<p class="small" style="margin:12px 0 0">Các giai đoạn vòng đời vật lý theo Hình 1. Thiết bị cũ được mua lại hoặc tái sử dụng đi vào từ giai đoạn lắp đặt.</p>`;
if(kind==='mechanisms')b=`<div class="table-wrap"><table><caption style="text-align:left;margin-bottom:10px">Tóm tắt Phụ lục 3 · EHEDG Doc. 58 (2024) · ví dụ, không đầy đủ</caption><thead><tr><th>Cơ chế</th><th>Hóa học</th><th>Sinh học</th><th>Vật lý</th></tr></thead><tbody><tr><td>Xâm nhập<br><small>từ bên ngoài</small></td><td>Hóa chất vệ sinh, chất bôi trơn, chất lỏng kỹ thuật</td><td>Vi sinh vật, động vật gây hại</td><td>Mảnh vụn xây dựng, mảnh chi tiết máy, vật liệu bảo hộ</td></tr><tr><td>Xâm nhập<br><small>sinh ra bên trong</small></td><td>Thôi nhiễm từ vật liệu chế tạo</td><td>—</td><td>Gioăng vỡ, bụi kim loại từ chi tiết quay, bu lông lỏng</td></tr><tr><td>Tích tụ</td><td>Chất gây dị ứng, chất bôi trơn, cặn hóa chất vệ sinh</td><td>Đóng cặn, màng sinh học</td><td>Cặn sản phẩm khác (hạt, màu, mùi)</td></tr><tr><td>Phát triển</td><td>—</td><td>Vi sinh vật và động vật gây hại ở nơi ẩn náu</td><td>—</td></tr></tbody></table></div><p class="small" style="margin:10px 0 0">Chất nhiễm và cơ chế thay đổi theo giai đoạn: lắp đặt, khởi động, chế biến, vệ sinh, bảo trì.</p>`;
if(kind==='matrix')b=`<div class="eyebrow">THỬ MA TRẬN · VÍ DỤ, KHÔNG PHẢI CHUẨN</div><div class="calc"><div class="fields"><label>Ma trận<select id="mx-v">${MATRICES.map((x,i)=>`<option value="${i}" ${i===matrixSel.v?'selected':''}>${x.name}</option>`).join('')}</select></label><label>Khả năng xảy ra<select id="mx-l">${LIKE.map((x,i)=>`<option value="${i}" ${i===matrixSel.l?'selected':''}>${x}</option>`).join('')}</select></label><label>Tác động tiêu cực<select id="mx-i">${IMPACT.map((x,i)=>`<option value="${i}" ${i===matrixSel.i?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="calc-result" id="mx-out" role="status">${matrixTable()}</div></div>`;
if(kind==='measures')b=`<div class="table-wrap"><table><caption style="text-align:left;margin-bottom:10px">Tóm tắt bảng ví dụ ở §5.4 · EHEDG Doc. 58 (2024), tr. 28–29</caption><thead><tr><th>Nhóm biện pháp</th><th>Ví dụ</th><th>Phụ thuộc con người</th></tr></thead><tbody><tr><td><b>1 · Loại bỏ</b></td><td>Nhà máy riêng cho sản phẩm không chất gây dị ứng; thiết kế bỏ chất bôi trơn</td><td>Không</td></tr><tr><td><b>2 · Nguyên tắc thiết kế vệ sinh</b><br><small>chủ động</small></td><td>Phớt kép, phân vùng, van hai đế; bỏ đầu cụt, sàn dốc; CIP thay rửa tay; nhựa dò được</td><td>Không</td></tr><tr><td><b>3 · Kiểm soát kỹ thuật</b><br><small>bị động</small></td><td>Phát hiện rò; giám sát áp suất, độ dẫn điện, nhiệt độ; dò kim loại; X-quang</td><td>Một phần</td></tr><tr><td><b>4 · IFU, SOP, hướng dẫn công việc</b></td><td>Quy trình vận hành, bảo trì, vệ sinh; kiểm tra và lấy mẫu mở rộng</td><td>Nhiều nhất</td></tr></tbody></table></div><p class="small" style="margin:10px 0 0">Cột “Phụ thuộc con người” là diễn giải của người biên soạn từ đoạn mô tả thứ bậc ở tr. 27.</p>`;
if(kind==='sequence')b=`<div class="eyebrow">BÀI TẬP SẮP XẾP</div><p>Rủi ro: chất bôi trơn độc lọt vào sản phẩm. Xếp các biện pháp từ hiệu quả và đáng tin cậy nhất xuống ít nhất. Dùng ↑ ↓.</p><ol class="sequence">${sequence.map((x,i)=>`<li><b>${i+1}</b><span>${x}</span><button data-seq="${i}" data-delta="-1" ${i===0?'disabled':''} aria-label="Đưa ${x} lên">↑</button><button data-seq="${i}" data-delta="1" ${i===sequence.length-1?'disabled':''} aria-label="Đưa ${x} xuống">↓</button></li>`).join('')}</ol><button data-seq-check>Kiểm tra thứ tự</button><div id="seq-result" role="status">${seqResult?`<p class="feedback">${seqResult}</p>`:''}</div>`;
if(kind==='scenario')b=scenarioView();
if(kind==='checklist')b=checklistView();
return `<section class="visual">${b}</section>`}
const checks=['Phạm vi, bối cảnh và tiêu chí của bài đánh giá được nêu rõ.','Các chất nhiễm đã xét (hóa học, sinh học, vật lý) được liệt kê.','Từng rủi ro vệ sinh được mô tả bằng chất nhiễm, cơ chế nhiễm và mức ưu tiên.','Quyết định giảm rủi ro được ghi theo kênh: nguyên tắc thiết kế vệ sinh, IFU, quy trình vận hành/PRP/OPRP.','Rủi ro còn lại nhưng chấp nhận được được nêu rõ, cùng người chịu trách nhiệm kiểm soát.','Có ngày, thành viên đội, tham chiếu tài liệu kỹ thuật, bằng chứng kiểm tra xác nhận và hình ảnh.'];
function checklistView(){return `<div class="eyebrow">CHECKLIST THỰC HÀNH</div>${checks.map((x,i)=>`<label class="check-row"><input type="checkbox" data-check="${i}" ${state().checklist.includes(i)?'checked':''}><span>${esc(x)}</span></label>`).join('')}<div class="row" style="margin-top:17px"><button data-print-check>In phiếu mang về</button><small>Phiếu học tập · Điều chỉnh theo SOP trước khi áp dụng.</small></div>`}
function scenarioView(){if(scenarioStep>=2)return `<h3>Đã đi hết tình huống</h3><p class="feedback">Bạn đã đi theo các quyết định trong ví dụ ở Phụ lục 5-4: che chắn và dọn dẹp ngay, rồi tách hẳn khâu tiếp nhận và làm sạch ra một cơ sở mới. Mỗi nhà máy phải tự cân nhắc hiệu quả, chi phí và logistics của mình.</p><button data-scenario-reset>Làm lại tình huống</button>`;
const steps=[{q:'Xét nghiệm định kỳ thấy Salmonella rất cao trong một hũ bơ đậu phộng. Kết quả định kiểu gợi ý nguồn từ chim. Đội đã chọn biện pháp ngắn hạn nào?',opts:['Loại bỏ hết chim trong khu vực và giữ nguyên cách vận chuyển.','Che băng tải chở hũ đã chiết, gia cố rào chắn chim vào xưởng, dọn sạch đậu rơi ngoài trời.','Đổi sang bao không thấm cho quãng vận chuyển ngắn trong nhà máy.'],a:1},{q:'Các biện pháp ngắn hạn được thừa nhận là chưa đủ tin cậy về lâu dài. Phương án dài hạn nào được chọn?',opts:['Tăng lấy mẫu thành phẩm vĩnh viễn và giữ nguyên hiện trạng.','Xây hầm vận chuyển kín giữa kho và xưởng.','Xây cơ sở tiếp nhận, kiểm nghiệm, làm sạch mới tại cảng; đóng lại vào thùng kín, làm sạch được; giao bằng xe kín.'],a:2}];const x=steps[scenarioStep];return `<div class="eyebrow">QUYẾT ĐỊNH ${scenarioStep+1} / 2 · VÍ DỤ PHỤ LỤC 5-4</div><h3>${x.q}</h3>${x.opts.map((o,i)=>`<button class="choice" data-scenario="${i}" data-answer="${x.a}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}${scenarioWrong?`<div class="feedback bad" role="status">${scenarioWrong}</div>`:''}<small>Chọn để xem hệ quả. Có thể thử lại; không tính vào điểm thi cuối khóa.</small>`}
function practiceView(m){const module=C.modules[m-1],qs=practiceQuestions(m),s=state();return `<div class="eyebrow">LUYỆN TẬP / BÀI ${m}</div><h2>${esc(module.title)}</h2><p class="lead">Trả lời để nhận giải thích ngay. Có thể chọn lại sau khi ôn; kết quả này không phải điểm thi cuối khóa.</p>${qs.map(q=>{const v=(mode==='trainer'?trainerPractice:s.practice)[q.id],answered=Number.isInteger(v);return `<fieldset class="question-card"><legend>${esc(q.q)}</legend>${q.options.map((o,j)=>`<button class="choice ${v===j?(j===q.answer?'correct':'wrong'):''}" data-practice-q="${q.id}" data-option="${j}" aria-pressed="${v===j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}${answered?`<div class="feedback ${v===q.answer?'':'bad'}" role="status"><b>${v===q.answer?'Chính xác.':'Cần ôn lại.'}</b> ${esc(q.why)} <button data-slide="${q.slide}">Ôn màn hình ${q.slide}</button></div>`:''}</fieldset>`}).join('')}<div class="panel"><h3>${s.completed.includes(m)?'✓ Bài học đã hoàn thành':'Hoàn thành bài học'}</h3><p>Đã xem ${moduleSlides(m).filter(x=>s.seen.includes(x.id)).length}/4 màn hình · Luyện tập đúng ${countPractice(m)}/${qs.length} câu.</p>${mode==='trainer'?'<p class="notice">Chế độ giảng viên không cấp trạng thái hoàn thành. Chuyển về Học viên để ghi nhận việc học.</p>':`<button class="primary" data-complete="${m}" ${!canComplete(m)?'disabled':''}>${m<8?'Hoàn thành & sang bài tiếp →':'Hoàn thành & đến đánh giá →'}</button>`}<button data-slide="${moduleSlides(m)[0].id}">Xem lại bài</button></div>`}
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startExam(){if(!db.active){askProfile(()=>startExam());return}if(!ready()||mode!=='learner'){notify('Hoàn thành 8 bài ở chế độ Học viên trước khi thi.');return}const s=state();if(s.exam&&!confirm('Bỏ lượt thi đang dở và tạo lượt mới?'))return;const ids=C.modules.flatMap(m=>shuffled(C.questions.filter(q=>q.module===m.id)).slice(0,C.examPerModule).map(q=>q.id));s.exam={ids:shuffled(ids),answers:{},started:new Date().toISOString()};save();go('exam')}
function examView(){const s=state(),exam=s.exam;if(!exam)return `<div class="eyebrow">ĐÁNH GIÁ CUỐI KHÓA</div><h2>Kiểm tra điều bạn đã hiểu.</h2><p class="lead">16 câu, chọn 2 câu từ mỗi bài trong ngân hàng 24 câu. Điểm và giải thích chỉ xuất hiện sau khi nộp.</p><div class="panel"><div class="grid"><div><h3>Đủ 8 bài</h3><p>Hiện tại: ${s.completed.length}/8 bài hoàn thành.</p></div><div><h3>Ngưỡng ${C.passPercent}%</h3><p>Cần đúng ít nhất ${needed()}/16 câu (${(needed()/16*100).toLocaleString('vi-VN')}%).</p></div><div><h3>Lưu từng lần làm</h3><p>Có thể thi lại. Các lượt đã nộp được giữ trong hồ sơ trên máy.</p></div></div><button class="primary" data-exam-start ${!ready()||mode!=='learner'?'disabled':''}>Bắt đầu đánh giá →</button>${!ready()?'<p class="small" style="margin:12px 0 0">Mở từng bài, xem đủ nội dung và hoàn thành luyện tập để mở bài thi.</p>':''}${mode==='trainer'?'<p class="notice">Chuyển sang Học viên để làm bài đánh giá.</p>':''}</div><button data-go="results">Xem lịch sử kết quả</button>`;
return `<div class="eyebrow">LƯỢT THI ĐANG THỰC HIỆN</div><h2>Đánh giá cuối khóa</h2><p class="muted">Có thể đổi lựa chọn trước khi nộp. Trả lời đủ 16 câu để chấm điểm.</p><div class="exam-progress row between"><strong id="exam-count">Đã trả lời ${Object.keys(exam.answers).length}/${exam.ids.length}</strong><button class="primary" data-submit-exam>Nộp bài</button></div>${exam.ids.map((id,i)=>{const q=C.questions.find(x=>x.id===id);return `<fieldset class="question-card" id="exam-q-${q.id}"><legend><small>CÂU ${i+1} / ${exam.ids.length} · BÀI ${q.module}</small><br>${esc(q.q)}</legend><div role="radiogroup" aria-label="Đáp án câu ${i+1}">${q.options.map((o,j)=>`<label class="choice ${exam.answers[id]===j?'selected':''}"><input type="radio" name="exam-${id}" data-exam-q="${id}" value="${j}" ${exam.answers[id]===j?'checked':''} style="width:auto;margin:0 10px 0 0">${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</div></fieldset>`}).join('')}<div class="row"><button class="primary" data-submit-exam>Nộp bài & xem kết quả</button><button data-abandon-exam>Hủy lượt đang làm</button></div>`}
function submitExam(){const s=state(),e=s.exam;if(!e||mode!=='learner')return;if(!ready()){notify('Cần hoàn thành đủ các bài.');return}const missing=e.ids.find(id=>!Number.isInteger(e.answers[id]));if(missing){notify('Hãy trả lời đủ tất cả câu hỏi trước khi nộp.');$('#exam-q-'+missing).scrollIntoView({block:'center'});return}const score=e.ids.filter(id=>e.answers[id]===C.questions.find(q=>q.id===id).answer).length;const a={...e,score,total:e.ids.length,percent:score/e.ids.length*100,pass:score/e.ids.length*100>=C.passPercent,submitted:new Date().toISOString(),id:'HDRM58-'+Date.now().toString(36).toUpperCase(),learner:{...profile().info},completed:[...s.completed],version:C.version};s.attempts.push(a);s.exam=null;save();go('results');}
function resultView(){const s=state(),attempt=s.attempts.at(-1);if(!attempt)return `<div class="eyebrow">HỒ SƠ HỌC TẬP</div><h2>Kết quả của bạn</h2><div class="panel"><p>Chưa có lượt đánh giá đã nộp. Bạn đã hoàn thành ${s.completed.length}/8 bài.</p><button class="primary" data-go="exam">Đến đánh giá</button> <button data-export>Xuất tiến độ hiện tại</button></div>`;return `<div class="no-print"><div class="eyebrow">KẾT QUẢ / LƯỢT GẦN NHẤT</div><h2>${attempt.pass?'Bạn đã đạt bài đánh giá.':'Hãy ôn lại rồi thử tiếp.'}</h2><div class="panel"><div class="row between"><div><div class="metric">${attempt.score}<small> / ${attempt.total} câu</small></div><p>${attempt.percent.toLocaleString('vi-VN')}% · ${attempt.pass?'Đạt':'Chưa đạt'} · Ngưỡng ${C.passPercent}%</p></div><div><button class="primary" data-exam-start>Thi lại</button> <button data-export>Xuất JSON</button> <button data-csv>Xuất CSV</button></div></div><div class="table-wrap"><table><thead><tr><th>Nhóm kiến thức</th><th>Kết quả</th><th>Ôn tập</th></tr></thead><tbody>${C.modules.map(m=>{const ids=attempt.ids.filter(id=>C.questions.find(q=>q.id===id)?.module===m.id);const correct=ids.filter(id=>attempt.answers[id]===C.questions.find(q=>q.id===id).answer).length;return `<tr><td>${m.id}. ${esc(m.title)}</td><td>${correct}/${ids.length}</td><td><button data-slide="${moduleSlides(m.id)[0].id}">Ôn bài</button></td></tr>`}).join('')}</tbody></table></div></div></div>${attempt.pass?certificate(attempt):''}<div class="no-print"><h3 style="margin-top:30px">Xem lại đáp án & giải thích</h3>${attempt.ids.map((id,i)=>{const q=C.questions.find(x=>x.id===id),a=attempt.answers[id];return `<details><summary>${i+1}. ${a===q.answer?'✓':'○'} ${esc(q.q)}</summary><p>Bạn chọn: ${esc(q.options[a])}<br><b>Đáp án: ${esc(q.options[q.answer])}</b></p><p>${esc(q.why)}</p><button data-slide="${q.slide}" style="margin-bottom:15px">Ôn màn hình ${q.slide}</button></details>`}).join('')}<div class="panel"><h3>Lịch sử ${s.attempts.length} lượt thi</h3>${[...s.attempts].reverse().map(a=>`<div class="history-item"><b>${a.score}/${a.total} · ${a.pass?'Đạt':'Chưa đạt'}</b> <small>${new Date(a.submitted).toLocaleString('vi-VN')}</small><br><small>${esc(a.id)}</small></div>`).join('')}</div></div>`}
function certificate(a){return `<section id="cert-area"><div class="row no-print" style="margin-top:25px"><button class="primary" data-print-cert>In / lưu PDF xác nhận</button><small>Chọn “Lưu dưới dạng PDF” trong hộp thoại in của trình duyệt.</small><label>Họ tên in trên xác nhận (tùy chọn)<input id="cert-name" maxlength="80" autocomplete="name" value="${esc(a.learner.name)}" placeholder="Có thể để trống"></label></div><div class="certificate"><div class="eyebrow">HDRM ACADEMY · ĐÀO TẠO NỘI BỘ</div><h2>XÁC NHẬN HOÀN THÀNH KHÓA HỌC</h2><div class="cert-line"></div><p class="learner-name">${esc(a.learner.name)||'……………………………………'}</p><p>Đã hoàn thành 8 bài học và bài đánh giá</p><h3>${esc(C.title)}</h3><p>Điểm: <b>${a.score}/${a.total} · ${a.percent.toLocaleString('vi-VN')}%</b></p><p>Ngày hoàn thành: ${new Date(a.submitted).toLocaleDateString('vi-VN')}</p><div class="cert-line"></div><small>Nội dung biên soạn từ EHEDG Doc. 58, tháng 5/2024 · Khóa ${esc(C.id)} · v${esc(a.version)}</small><small>Mã bản ghi cục bộ: ${esc(a.id)}</small><small>Biên soạn khóa học: Đặng Thanh Bình · dangthanhbinh53@gmail.com</small><small style="margin-top:15px">Đây là xác nhận học tập nội bộ do ứng dụng tạo từ dữ liệu trên máy.<br>Không phải chứng nhận của EHEDG; chưa xác minh danh tính hoặc năng lực thực hành.</small></div></section>`}
function resources(){return `<div class="eyebrow">TRA CỨU & MANG VỀ CÔNG VIỆC</div><h2>Tài liệu, công cụ & phạm vi</h2><p class="lead">Các bài học dẫn về trang và mục của tài liệu gốc để QA, kỹ thuật và giảng viên kiểm tra lại.</p><div class="panel"><h3>Nguồn chính</h3><p><b>EHEDG Doc. 58 — Hygienic Design Risk Management.</b><br>May 2024 · 33 trang nội dung chính, kèm phụ lục checklist và ví dụ · © EHEDG.</p><p>Biên soạn tiếng Việt từ PDF do người dùng cung cấp. Bản tiếng Anh là bản chính thức. App không bao gồm toàn bộ PDF và không xác nhận các tiêu chuẩn, quy định viện dẫn trong bản 2024 là phiên bản hiện hành.</p><p class="notice">Khi dùng để thiết kế, mua sắm hoặc xây SOP: đối chiếu bản tài liệu gốc, tiêu chuẩn áp dụng, yêu cầu địa phương, các hướng dẫn EHEDG liên quan, thông tin của nhà cung cấp thiết bị, đánh giá rủi ro và tiêu chí đã được cơ sở phê duyệt.</p><ol class="source-index">${C.modules.map(m=>`<li><b>${esc(m.title)}</b><br><small>${moduleSlides(m.id).map(s=>`${s.id}: ${esc(s.source)}`).join(' · ')}</small></li>`).join('')}</ol></div><div class="panel"><h3>Bảng thuật ngữ ngắn</h3><div class="table-wrap"><table><tbody>${[['HD','Thiết kế vệ sinh: thiết kế nhà xưởng, thiết bị, tiện ích để chúng vận hành vệ sinh và hỗ trợ GMP'],['HDRM / HDRA','Quản lý rủi ro thiết kế vệ sinh / Đánh giá rủi ro thiết kế vệ sinh'],['Rủi ro vệ sinh','Khả năng mối nguy hoặc chất nhiễm làm nhiễm dòng sản phẩm qua xâm nhập, tích tụ hoặc phát triển'],['Ingress · Accumulation · Growth','Xâm nhập · Tích tụ · Phát triển: ba cơ chế nhiễm'],['Legacy','Nhà xưởng, thiết bị đang được doanh nghiệp sử dụng'],['Assigned / Unassigned','Đặt riêng cho sản phẩm, quy trình, người dùng cụ thể / thiết kế trước cho nhiều ứng dụng chưa biết'],['URS','Đặc tả yêu cầu người dùng: các yêu cầu cốt lõi đối với tài sản'],['IFU','Thông tin sử dụng mà nhà cung cấp phải giao cho khách hàng'],['PRP','Chương trình tiên quyết: điều kiện và hoạt động cơ bản để duy trì an toàn thực phẩm'],['Kiểm soát kỹ thuật','Biện pháp giảm rủi ro bị động: phát hiện rò, giám sát áp suất, độ dẫn điện, nhiệt độ, dò kim loại, X-quang'],['TCO','Tổng chi phí sở hữu: chi phí đầu tư và chi phí vận hành trong tuổi thọ xác định'],['Verification / Validation','Kiểm tra xác nhận đã làm đúng và đủ / Thẩm định hiệu lực trong sử dụng thật']].map(x=>`<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h3>Phiếu áp dụng tại cơ sở</h3><p>Chọn một thiết bị, một phòng hoặc một dự án thực tế. Ghi phạm vi, rủi ro ưu tiên, biện pháp và người chịu trách nhiệm. Phiếu cần được cơ sở duyệt trước khi đưa vào SOP.</p>${checklistView()}</div><section class="author"><span class="avatar" aria-hidden="true">ĐB</span><div><small>Biên soạn & thiết kế khóa học</small><b>Đặng Thanh Bình</b><a href="mailto:dangthanhbinh53@gmail.com">dangthanhbinh53@gmail.com</a><p>© 2026 Đặng Thanh Bình. Bản quyền thuộc về tác giả đối với phần biên soạn tiếng Việt, ví dụ minh họa, thiết kế và phần mềm khóa học. Nội dung gốc EHEDG Doc. 58 © EHEDG.</p></div></section><div class="panel"><h3>Dữ liệu & cách sử dụng</h3><p>App chạy trong một file HTML, không gửi điểm hoặc thông tin học viên tới máy chủ. Không cần nhập thông tin cá nhân. Tiến độ lưu trong trình duyệt hiện tại; xóa dữ liệu trình duyệt hoặc chuyển máy có thể mất tiến độ.</p><p>Chức năng đọc dùng Google Translate TTS giống app mẫu: tiếng Việt, chia đoạn ngắn, thử tw-ob rồi gtx khi có lỗi. Cần Internet; lời thuyết minh được gửi tới Google, không gửi hồ sơ học viên. Dịch vụ có thể chặn hoặc giới hạn yêu cầu; khi không phát được, app dừng và cho phép đọc lại hoặc xem thủ công.</p><div class="row"><button data-export>Xuất hồ sơ JSON</button><button data-csv>Xuất lịch sử CSV</button><button data-profile>Đổi học viên</button><button data-reset>Xóa tiến độ học</button></div><p class="small" style="margin-top:15px">File xuất chứa thông tin học viên. JSON là bản lưu để kiểm tra/tổng hợp; bản này chưa có chức năng nhập phục hồi. CSV gồm các lượt thi đã nộp.</p></div><div id="print-checklist" hidden>${printChecklist()}</div>`}
function printChecklist(){return `<h2>Phiếu áp dụng · Nội dung báo cáo HDRM</h2><p>Khóa học từ EHEDG Doc.58 (2024) · Phiếu học tập, chưa phải biểu mẫu chính thức.</p><p>Người học: ................................................ Bộ phận: ................................</p><p>Thiết bị / phòng / dây chuyền được đánh giá: ..................................................</p><p>Giai đoạn vòng đời & mục đích sử dụng: ........................................................</p><p>Thành viên đội HDRM: ......................................................................................</p><ul>${checks.map(x=>`<li>□ ${x}</li>`).join('')}</ul><p>Rủi ro ưu tiên / biện pháp / người phụ trách: ..................................................</p><p>...................................................................................................................</p><p>Người xem xét: ..................................... Ngày: ..........................................</p><p><small>Tham chiếu: §7, tr.32; Phụ lục 5. Điều chỉnh theo hệ thống quản lý và tiêu chí của cơ sở.</small></p>`}
function fitDeck(){const el=document.querySelector('.lesson');if(!el)return;el.style.setProperty('--deck-zoom','1');if(!document.body.classList.contains('present'))return;const avail=innerHeight-28;let z=1;for(let i=0;i<10;i++){const height=el.getBoundingClientRect().height;if(!height)break;const next=Math.min(1.7,Math.max(.5,z*Math.pow(avail/height,.6)));if(Math.abs(next-z)<.003)break;z=next;el.style.setProperty('--deck-zoom',String(z))}}
let chromeTimer=null;
function peekChrome(ms=2600,which='both'){const b=document.body;if(which!=='bottom')b.classList.add('show-top');if(which!=='top')b.classList.add('show-bottom');clearTimeout(chromeTimer);chromeTimer=setTimeout(()=>b.classList.remove('show-top','show-bottom'),ms)}
function enterPresent(){document.body.classList.add('present');peekChrome(3500);notify('Đưa chuột tới mép trên hoặc mép dưới để hiện thanh điều khiển. Esc để thoát.')}
document.addEventListener('mousemove',e=>{if(!document.body.classList.contains('present'))return;if(e.clientY<70)peekChrome(2600,'top');else if(e.clientY>innerHeight-110)peekChrome(2600,'bottom')});
document.addEventListener('touchstart',()=>{if(document.body.classList.contains('present'))peekChrome(4000)},{passive:true});
document.addEventListener('animationend',e=>{if(e.target.classList&&e.target.classList.contains('lesson'))fitDeck()});
window.addEventListener('resize',()=>requestAnimationFrame(fitDeck));
document.addEventListener('toggle',()=>requestAnimationFrame(fitDeck),true);
function render(){nav();const mainEl=$('#main'),curSlide=route.type==='slide'?C.slides.find(s=>s.id===route.id):null;mainEl.dataset.anim=navDir;navDir='';mainEl.dataset.m=curSlide?curSlide.module:route.type==='practice'?route.id:'';$('#course-progress i').style.width=(curSlide?curSlide.id/C.slides.length*100:route.type==='practice'?moduleSlides(route.id).at(-1).id/C.slides.length*100:['exam','results'].includes(route.type)?100:0)+'%';mainEl.innerHTML=route.type==='slide'?slideView(route.id):route.type==='practice'?practiceView(route.id):route.type==='exam'?examView():route.type==='results'?resultView():route.type==='resources'?resources():home();$('#profile').textContent=db.active?profile().info.id:'Học viên';$('#present').textContent=document.body.classList.contains('present')?'Thoát trình chiếu':'Trình chiếu';$('#role').value=mode;storageStatus();speech.sync();requestAnimationFrame(fitDeck)}
function askProfile(cb){speech.stop();pending=cb||null;const i=profile().info;$('#emp-id').value=i.id;$('#emp-name').value=i.name;$('#emp-dept').value=i.dept;$('#profile-error').textContent='';$('#profile-dialog').showModal()}
function exportData(){if(!db.active){notify('Chọn học viên trước khi xuất hồ sơ.');return}download('HDRM58-'+safeName(profile().info.id)+'.json',JSON.stringify({course:{id:C.id,version:C.version,source:C.source},exported:new Date().toISOString(),profile:profile()},null,2),'application/json')}
function safeName(s){return String(s).replace(/[^\p{L}\p{N}_-]/gu,'_').slice(0,40)||'learner'}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type:type+';charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csv(){if(!db.active)return notify('Chọn học viên trước khi xuất.');const quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const rows=[['Mã nhân viên','Họ tên','Bộ phận','Khóa','Phiên bản','Ngày nộp','Đúng','Tổng','Phần trăm','Kết quả','Mã bản ghi'],...state().attempts.map(a=>[a.learner.id,a.learner.name,a.learner.dept,C.id,a.version,a.submitted,a.score,a.total,a.percent,a.pass?'Đạt':'Chưa đạt',a.id])];download('HDRM58-'+safeName(profile().info.id)+'.csv','\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv')}
function present(){if(document.body.classList.contains('present')){speech.stop();document.body.classList.remove('present');render();if(document.fullscreenElement)document.exitFullscreen?.();return}if(route.type!=='slide')go('slide',state().lastSlide);enterPresent();speech.auto=true;render();document.documentElement.requestFullscreen?.().catch(()=>notify('Có thể dùng F11 để mở toàn màn hình.'));speech.start()}
function printMode(kind){speech.stop();if(kind==='cert'){if(route.type!=='results'||!state().attempts.at(-1)?.pass)return;document.body.classList.add('print-cert')}else{let el=$('#print-checklist');if(!el){el=document.createElement('section');el.id='print-checklist';el.hidden=true;el.innerHTML=printChecklist();$('#main').appendChild(el)}document.body.classList.add('print-check')}window.print();setTimeout(()=>document.body.classList.remove('print-cert','print-check'),500)}
window.addEventListener('afterprint',()=>document.body.classList.remove('print-cert','print-check'));
// Same Google Translate TTS endpoint and client fallback as the supplied HACCP app.
// Only course narration is sent; learner records never enter a request URL.
const speech={audio:new Audio(),available:true,auto:true,stopAtPractice:false,muted:false,token:0,active:false,paused:false,rate:1.2,parts:[],index:0,pending:null,timer:null,advanceTimer:null,message:'Sẵn sàng · Google TTS · cần Internet',loadTimeout:25000,
 status(t){this.message=t;this.sync();if(/chặn|Không phát được/.test(t)&&document.body.classList.contains('present'))peekChrome(8000)},
 sync(){const el=$('#audio-status');if(el)el.textContent=this.message;const p=$('[data-pause]');if(p)p.textContent=this.active?(this.paused?'▶ Tiếp tục':'Ⅱ Tạm dừng'):'▶ Phát';const mute=$('[data-mute]');if(mute){mute.textContent=this.muted?'Bật tiếng':'Tắt tiếng';mute.setAttribute('aria-pressed',String(this.muted))}const line=$('#tts-progress');if(line)line.style.width=(this.parts.length?this.index/this.parts.length*100:0)+'%';},
 url(text,client='tw-ob'){return 'https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&total=1&idx=0&client='+client+'&q='+encodeURIComponent(text)+'&textlen='+text.length},
 normalize(t){return t.replace(/\bHDRM\b/g,'hát đi a em').replace(/\bHACCP\b/g,'hát xắp').replace(/\bEHEDG\b/g,'i hát i đi gi').replace(/\bCIP\b/g,'xi ai pi').replace(/\bURS\b/g,'iu a ét').replace(/\bIFU\b/g,'ai ép iu').replace(/\bQA\b/g,'kiu ây').replace(/Salmonella/g,'san mô nen la').replace(/Listeria/g,'lít tê ri a').replace(/axit/gi,'a xít').replace(/\s+/g,' ').trim()},
 split(t){const sentences=this.normalize(t).match(/[^.!?]+[.!?]?/g)||[];const out=[];for(const sentence of sentences){let line='';for(const word of sentence.trim().split(/\s+/)){if((line+' '+word).trim().length>170){if(line)out.push(line);line='';}if(word.length>170){for(let i=0;i<word.length;i+=170)out.push(word.slice(i,i+170));}else line=(line+' '+word).trim();}if(line)out.push(line);}return out},
 settle(ok){clearTimeout(this.timer);this.timer=null;const resolve=this.pending;this.pending=null;this.audio.onended=null;this.audio.onerror=null;this.audio.onplaying=null;this.audio.onwaiting=null;this.audio.onstalled=null;if(resolve)resolve(ok)},
 stop(){this.token++;clearTimeout(this.advanceTimer);this.advanceTimer=null;this.active=false;this.paused=false;this.audio.pause();this.settle(false);this.audio.removeAttribute('src');this.audio.load();this.status('Đã dừng đọc.')},
 speak(text,token){return new Promise(resolve=>{this.pending=resolve;let attemptId=0;const attempt=client=>{const attemptToken=++attemptId;if(token!==this.token){this.settle(false);return}const valid=()=>token===this.token&&attemptToken===attemptId&&!!this.pending;const a=this.audio;const fail=err=>{if(!valid())return;clearTimeout(this.timer);if(err?.name==='NotAllowedError'){this.settle(false);this.status('Trình duyệt chặn âm thanh. Bấm Phát hoặc Đọc lại để tiếp tục.');return}if(client==='tw-ob')attempt('gtx');else{this.settle(false);this.status('Không phát được Google TTS. Kiểm tra Internet rồi bấm Đọc lại; vẫn có thể xem thủ công.')}};this.armTimeout=()=>{clearTimeout(this.timer);if(valid()&&!this.paused)this.timer=setTimeout(()=>fail(),this.loadTimeout)};a.pause();a.onended=()=>{if(valid())this.settle(true)};a.onerror=fail;a.onplaying=()=>{if(valid()){clearTimeout(this.timer);this.timer=null}};a.onwaiting=this.armTimeout;a.onstalled=this.armTimeout;a.src=this.url(text,client);a.playbackRate=this.rate;a.preservesPitch=true;a.muted=this.muted;this.armTimeout();if(!this.paused){try{a.play().catch(fail)}catch(err){fail(err)}}};attempt('tw-ob')})},
 async start(){this.stop();if(route.type!=='slide')return;const slide=C.slides.find(s=>s.id===route.id);const token=this.token;this.parts=this.split(slide.narration);this.index=0;this.active=true;this.status('Đang tải giọng Google · màn hình '+slide.id);for(this.index=0;this.index<this.parts.length;this.index++){if(token!==this.token)return;while(this.paused){await new Promise(r=>setTimeout(r,80));if(token!==this.token)return}this.status('Google TTS · màn hình '+slide.id+' · đoạn '+(this.index+1)+'/'+this.parts.length);const ok=await this.speak(this.parts[this.index],token);if(token!==this.token)return;if(!ok){this.active=false;this.paused=false;this.audio.pause();this.sync();return}}if(token!==this.token)return;this.status('Đã đọc xong màn hình '+slide.id);if(!this.auto){this.active=false;this.sync();return}this.status('Đã đọc xong · sắp chuyển màn hình');const advance=()=>{if(token!==this.token||!this.auto){this.active=false;this.sync();return}if(this.paused){this.advanceTimer=setTimeout(advance,100);return}this.active=false;const last=moduleSlides(slide.module).at(-1).id;if(this.stopAtPractice&&slide.id===last){go('practice',slide.module);notify('Đã dừng để luyện tập bài '+slide.module+'.');return}if(slide.id===C.slides.at(-1).id){this.status('Đã trình chiếu hết 32 màn hình. Hoàn thành luyện tập các bài để mở đánh giá.');notify('Đã đọc hết khóa học. Việc xem tự động không thay thế luyện tập và bài thi.');return}go('slide',slide.id+1);this.start()};this.advanceTimer=setTimeout(advance,900)},
 pause(){if(!this.active){this.start();return}if(this.paused){this.paused=false;this.status('Đang tiếp tục đọc');if(this.pending){this.armTimeout?.();this.audio.play().catch(e=>{if(e.name==='NotAllowedError'){this.stop();this.status('Âm thanh bị chặn. Bấm Đọc lại.')}})}}else{this.paused=true;clearTimeout(this.timer);this.audio.pause();this.status('Đã tạm dừng')}this.sync()},
 setRate(v){this.rate=Number(v);this.audio.playbackRate=this.rate},
 mute(){this.muted=!this.muted;this.audio.muted=this.muted;this.sync()}
};
function beginAutomatic(){const run=()=>{go('slide',state().lastSlide);enterPresent();speech.auto=true;render();document.documentElement.requestFullscreen?.().catch(()=>{});speech.start()};if(!db.active)askProfile(run);else run()}
function moveSlide(n){const resume=speech.active&&!speech.paused&&document.body.classList.contains('present');go('slide',Math.max(1,Math.min(C.slides.length,n)));if(resume)speech.start()}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
if(d.go){go(d.go);return}if(d.slide){moveSlide(+d.slide);return}if(d.practice){go('practice',+d.practice);return}
if('start'in d){beginAutomatic();return}if('manual'in d){const run=()=>{document.body.classList.remove('present');go('slide',state().lastSlide)};if(!db.active)askProfile(run);else run();return}if('ttsPrev'in d){moveSlide(route.id-1);return}if('ttsNext'in d){moveSlide(route.id+1);return}if('mute'in d){speech.mute();return}
if('profile'in d){askProfile();return}if('present'in d){present();return}
if('ahu'in d){$$('[data-ahu]').forEach(x=>x.classList.toggle('active',x===b));$('#ahu-info').textContent=principleInfo[+d.ahu][1];return}
if('seq'in d){const i=+d.seq,j=i+(+d.delta);[sequence[i],sequence[j]]=[sequence[j],sequence[i]];seqResult='';render();$(`[data-seq="${j}"][data-delta="${d.delta}"]`)?.focus();return}
if('seqCheck'in d){seqResult=sequence.every((x,i)=>x===SEQ_CORRECT[i])?'Chính xác. Loại bỏ → nguyên tắc thiết kế vệ sinh → kiểm soát kỹ thuật → thông tin sử dụng và quy trình. Càng về sau càng phụ thuộc con người.':'Chưa đúng. Biện pháp chủ động (loại bỏ, rồi nguyên tắc thiết kế vệ sinh) đứng trước; kiểm soát kỹ thuật chỉ phát hiện; hướng dẫn và quy trình phụ thuộc con người nhiều nhất.';$('#seq-result').innerHTML=`<p class="feedback">${seqResult}</p>`;return}
if('scenario'in d){if(+d.scenario===+d.answer){scenarioStep++;scenarioWrong='';notify(scenarioStep===1?'Đúng với ví dụ: tách biệt ngay tại điểm sản phẩm hở và giảm sức hút với chim.':'Đã hoàn thành tình huống.')}else scenarioWrong=scenarioStep===0?'Chưa đúng với ví dụ. Loại bỏ hẳn chim được coi là không thể hoặc không đáng tin cậy; bao không thấm vẫn bẩn mặt ngoài và mang chất nhiễm vào xưởng.':'Chưa đúng với ví dụ. Hầm vận chuyển bị bác vì đầu tư lớn vào cơ sở cũ và khó bảo đảm làm sạch được; chỉ lấy mẫu thêm thì phụ thuộc con người và không ngăn được xâm nhập.';render();return}
if('scenarioReset'in d){scenarioStep=0;scenarioWrong='';render();return}
if('practiceQ'in d){if(mode==='trainer')trainerPractice[+d.practiceQ]=+d.option;else{state().practice[+d.practiceQ]=+d.option;if(db.active)save();}const y=scrollY;render();window.scrollTo(0,y);return}
if('complete'in d){const m=+d.complete;if(mode!=='learner'||!canComplete(m))return;if(!db.active){askProfile(()=>{notify('Đã chọn hồ sơ. Hãy kiểm tra tiến độ và luyện tập của hồ sơ này.');go('practice',m)});return}if(!state().completed.includes(m))state().completed.push(m);save();notify('Đã hoàn thành bài '+m+'.');if(m<8)go('slide',moduleSlides(m+1)[0].id);else go('exam');return}
if('examStart'in d){startExam();return}if('submitExam'in d){submitExam();return}if('abandonExam'in d){if(confirm('Hủy các câu trả lời của lượt chưa nộp? Lịch sử lượt đã nộp được giữ.')){state().exam=null;save();render()}return}
if('export'in d){exportData();return}if('csv'in d){csv();return}if('printCert'in d){printMode('cert');return}if('printCheck'in d){printMode('check');return}
if('reset'in d){if(db.active&&confirm('Xóa toàn bộ tiến độ và lịch sử thi trên trình duyệt này? Hãy xuất kết quả trước nếu cần giữ.')){profile().state=fresh();save();go('home')}return}
if('speak'in d){speech.start();return}if('pause'in d){speech.pause();return}if('stop'in d){speech.stop();return}
});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.examQ){const id=+d.examQ;state().exam.answers[id]=+e.target.value;save();const root=e.target.closest('fieldset');root.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x.querySelector('input').checked));$('#exam-count').textContent=`Đã trả lời ${Object.keys(state().exam.answers).length}/${state().exam.ids.length}`;}if('check'in d){const i=+d.check;state().checklist=state().checklist.filter(x=>x!==i);if(e.target.checked)state().checklist.push(i);if(db.active)save()}if(['mx-v','mx-l','mx-i'].includes(e.target.id)){matrixSel={v:+$('#mx-v').value,l:+$('#mx-l').value,i:+$('#mx-i').value};$('#mx-out').innerHTML=matrixTable()}if(e.target.id==='auto-read')speech.auto=e.target.checked;if(e.target.id==='rate')speech.setRate(e.target.value);if(e.target.id==='pause-practice')speech.stopAtPractice=e.target.checked;});
// (no numeric tools in this course)
$('#profile-form').addEventListener('submit',e=>{e.preventDefault();const info={id:$('#emp-id').value.trim(),name:$('#emp-name').value.trim(),dept:$('#emp-dept').value.trim()};if(Object.values(info).some(x=>!x)){ $('#profile-error').textContent='Vui lòng nhập đủ thông tin.';return}const key='person:'+info.id.toLocaleUpperCase('vi-VN');const existing=db.profiles[key];if(existing&&(existing.info.name!==info.name||existing.info.dept!==info.dept)&&!confirm('Mã này đã có hồ sơ '+existing.info.name+'. Cập nhật tên/bộ phận? Lượt thi cũ giữ nguyên thông tin lúc nộp.'))return;if(!existing)db.profiles[key]={info,state:fresh()};else existing.info=info;db.active=key;validateState();save();$('#profile-dialog').close();scenarioStep=0;scenarioWrong='';const cb=pending;pending=null;if(cb)cb();else go('home')});
$('#profile-cancel').onclick=()=>{$('#profile-dialog').close();pending=null};$('#profile-dialog').addEventListener('cancel',()=>pending=null);
$('#profile').onclick=()=>askProfile();$('#present').onclick=present;$('#menu').onclick=()=>{const open=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open))};
$('#theme').onclick=()=>{document.body.classList.toggle('dark');db.theme=document.body.classList.contains('dark')?'dark':'light';save()};
$('#role').onchange=e=>{speech.stop();mode=e.target.value;if(mode==='trainer'&&route.type==='exam'&&state().exam)go('home');else render();notify(mode==='trainer'?'Chế độ giảng viên: hiện gợi ý, không ghi nhận xem bài.':'Chế độ học viên.');};
$('#search').addEventListener('input',e=>{const q=fold(e.target.value.trim()),r=$('#search-results');r.hidden=!q;if(!q)return;const found=C.slides.filter(s=>fold([s.title,s.lead,...s.cards.map(c=>c.title+' '+c.text),s.example||''].join(' ')).includes(q));r.innerHTML=found.length?found.map(s=>`<button data-slide="${s.id}"><small>Bài ${s.module} · Màn hình ${s.id}</small><br>${esc(s.title)}</button>`).join(''):'<p class="small">Không tìm thấy. Thử “xâm nhập”, “ma trận”, “URS”…</p>'});
$('#search-results').addEventListener('click',()=>{$('#search-results').hidden=true;$('#search').value=''});document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))$('#search-results').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){speech.stop();if(document.body.classList.contains('present')){document.body.classList.remove('present');render()}$('#sidebar').classList.remove('open');$('#search-results').hidden=true;}if($('#profile-dialog').open||/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)||route.type!=='slide')return;if(e.key==='ArrowRight'){e.preventDefault();moveSlide(route.id+1)}if(e.key==='ArrowLeft'){e.preventDefault();moveSlide(route.id-1)}if(e.code==='Space'&&document.body.classList.contains('present')){e.preventDefault();speech.pause()}});
window.addEventListener('beforeunload',()=>speech.stop());if(db.theme==='dark')document.body.classList.add('dark');document.addEventListener('input',e=>{if(e.target.id!=='cert-name')return;const a=state().attempts.at(-1);if(!a)return;const v=e.target.value.trim();a.learner.name=v;profile().info.name=v;save();const el=$('.certificate .learner-name');if(el)el.textContent=v||'……………………………………'});render();
</script></body></html>
